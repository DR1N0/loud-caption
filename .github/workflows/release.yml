name: Release artifacts

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833

      - name: Install Android SDK packages
        run: >
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
          "cmake;3.22.1"

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/loud-caption-upload.jks"
          chmod 600 "$RUNNER_TEMP/loud-caption-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/loud-caption-upload.jks" >> "$GITHUB_ENV"

      - name: Check tag matches pubspec version
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version v${version}." >&2
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build arm64 release APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --split-per-abi
          --no-pub

      - name: Build arm64 release AAB
        run: >
          flutter build appbundle --release
          --target-platform android-arm64
          --no-pub

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs -name 'app-arm64-v8a-release.apk' -print -quit)"
          aab="$(find build/app/outputs -name 'app-release.aab' -print -quit)"
          if [ -z "${apk}" ]; then
            echo "arm64 release APK not found." >&2
            exit 1
          fi
          if [ -z "${aab}" ]; then
            echo "release AAB not found." >&2
            exit 1
          fi
          mkdir -p dist
          cp "${apk}" dist/app-release.apk
          cp "${aab}" dist/app-release.aab
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum app-release.apk app-release.aab > SHA256SUMS)
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-release.aab
            dist/SHA256SUMS
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
          generate_release_notes: true
