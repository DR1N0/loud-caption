name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833

      - name: Install Android SDK packages
        run: >
          sdkmanager
          "platforms;android-36"
          "build-tools;36.0.0"
          "ndk;28.2.13676358"
          "cmake;3.22.1"

      - name: Check tag matches pubspec version
        run: |
          version="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version v${version}." >&2
            exit 1
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Build arm64 release APK
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --split-per-abi
          --no-pub

      - name: Collect APK and checksum
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs -name 'app-arm64-v8a-release.apk' -print -quit)"
          if [ -z "${apk}" ]; then
            echo "arm64 release APK not found." >&2
            exit 1
          fi
          mkdir -p dist
          cp "${apk}" dist/app-release.apk
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum app-release.apk > app-release.apk.sha256)
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
            dist/LICENSE
            dist/THIRD_PARTY_NOTICES.md
          generate_release_notes: true
